# Copy these lines into Streamlit Cloud: Manage app > Settings > Secrets
ADMIN_PASSWORD = "change-this-admin-password"
ANALYST_PASSWORD = "change-this-analyst-password"
LLM_PROVIDER = "openai"
LLM_BASE_URL = "https://api.groq.com/openai/v1"
LLM_API_KEY  = "paste-your-key-here"
LLM_MODEL    = "openai/gpt-oss-120b"
# Model that can READ PICTURES (needed for Scan and image descriptions). Groq example:
LLM_VISION_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"

# --- Permanent storage (keeps websites, library files and chats after restarts) ---
# 1) Create a PRIVATE GitHub repo just for data, e.g. "gov-ai-data" (add a README so it has a main branch).
# 2) GitHub > Settings > Developer settings > Fine-grained tokens: access ONLY that repo,
#    permission "Contents: Read and write".
PERSIST_GITHUB_TOKEN = "github_pat_paste-your-token-here"
PERSIST_GITHUB_REPO  = "your-github-name/gov-ai-data"
# PERSIST_GITHUB_BRANCH = "main"
# PERSIST_GITHUB_PATH   = "database.db.gz"

# Optional Android phone monitor service (deploy mobile_monitor_service separately)
MOBILE_MONITOR_API_URL = "https://your-monitor-service.example.com"
MOBILE_MONITOR_API_KEY = "replace-with-a-long-random-secret"

# --- Encrypted 2FA recovery-code backup to Google Drive (Personal Gmail OAuth) ---
# Create an OAuth 2.0 Client ID of type Web application in Google Cloud.
# Add your Streamlit app URL as an Authorized redirect URI (exact match).
# Paste the downloaded OAuth client JSON (web application) here:
# GOOGLE_DRIVE_OAUTH_CLIENT_JSON = """{ ... complete OAuth client JSON ... }"""
# Must exactly match the Authorized redirect URI in Google Cloud:
GOOGLE_DRIVE_OAUTH_REDIRECT_URI = "https://your-app-name.streamlit.app"
# Private Google Drive folder ID (create the folder in your own Gmail Drive):
GOOGLE_DRIVE_BACKUP_FOLDER_ID = "paste-private-folder-id-here"
# AUTH_ENCRYPTION_KEY encrypts the stored refresh token and recovery-code backups.
