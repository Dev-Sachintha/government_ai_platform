# Copy these lines into Streamlit Cloud: Manage app > Settings > Secrets
ADMIN_PASSWORD = "change-this-admin-password"
ANALYST_PASSWORD = "change-this-analyst-password"
LLM_PROVIDER = "openai"
LLM_BASE_URL = "https://api.groq.com/openai/v1"
LLM_API_KEY  = "paste-your-key-here"
LLM_MODEL    = "openai/gpt-oss-120b"

# --- Permanent storage (keeps websites, library files and chats after restarts) ---
# 1) Create a PRIVATE GitHub repo just for data, e.g. "gov-ai-data" (add a README so it has a main branch).
# 2) GitHub > Settings > Developer settings > Fine-grained tokens: access ONLY that repo,
#    permission "Contents: Read and write".
PERSIST_GITHUB_TOKEN = "github_pat_paste-your-token-here"
PERSIST_GITHUB_REPO  = "your-github-name/gov-ai-data"
# PERSIST_GITHUB_BRANCH = "main"
# PERSIST_GITHUB_PATH   = "database.db.gz"
