<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoloMotion — GPU Particle & 3D Model Stage</title>
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(13, 20, 38, 0.84);
      --border: rgba(56, 189, 248, 0.28);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewport {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 310px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }
    .hud-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }
    .hud-header p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
    }
    select, button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: var(--accent);
      color: #030712;
      font-weight: 600;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 0.78rem;
      padding: 6px 10px;
    }
    .btn-secondary:hover {
      background: rgba(239, 68, 68, 0.28);
    }
    .fact-box {
      font-size: 0.76rem;
      line-height: 1.4;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.65);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid var(--accent);
    }
    .status-bar {
      font-size: 0.75rem;
      color: var(--muted);
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
    }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <aside class="hud-panel">
    <div class="hud-header">
      <h1>HOLOMOTION</h1>
      <p>Surface-Sampled GPU Particle Engine</p>
    </div>

    <div class="control-group">
      <label for="model-select">Active Hologram Model</label>
      <select id="model-select"></select>
    </div>

    <div class="control-group">
      <button id="add-model-btn" class="btn-primary" type="button">
        <span>+ Add External 3D Model (.glb, .obj, .stl)</span>
      </button>
      <input
        id="model-file-input"
        type="file"
        accept=".glb,.obj,.stl"
        class="hidden"
      />
      <button id="remove-model-btn" class="btn-secondary hidden" type="button">
        Remove Custom Model
      </button>
    </div>

    <div id="model-fact" class="fact-box">Select or upload a 3D model.</div>

    <div class="status-bar">
      <span id="status-text">Ready</span>
      <span id="particle-count">15,000 pts</span>
    </div>
  </aside>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
